name: Check index

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m gdc_index validate
      - run: python -m unittest discover -s tests -v
      - run: python -m gdc_index build --check
