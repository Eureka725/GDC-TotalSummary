name: Collect public metadata

on:
  workflow_dispatch:
    inputs:
      year:
        description: GDC year (for example 2026)
        required: true
        default: '2026'
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDC_YEAR: ${{ inputs.year }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Validate requested year
        run: python -c "import os,re; assert re.fullmatch(r'20[0-9]{2}', os.environ['GDC_YEAR']), 'Expected a year in 2000..2099'"
      - name: Collect public metadata
        run: python -m gdc_index sync --year "$GDC_YEAR" --details --refresh
      - run: python -m gdc_index validate
      - run: python -m gdc_index build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gdc-index-${{ inputs.year }}
          path: |
            data/${{ inputs.year }}/sessions.json
            data/${{ inputs.year }}/recordings.json
            ${{ inputs.year }}/*.md
            README.md
          retention-days: 14
